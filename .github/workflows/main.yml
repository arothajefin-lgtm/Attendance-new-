name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myApp com.arothajefin.myapp MyApp
          # നിങ്ങളുടെ HTML ഫയലുകൾ Cordova-യുടെ www ഫോൾഡറിലേക്ക് മാറ്റുന്നു
          cp -r * myApp/www/ || true
          cd myApp
          cordova platform add android

      - name: Build Android APK
        run: |
          cd myApp
          # Release APK ബിൽഡ് ചെയ്യുന്നു
          cordova build android --release -- --gradleArg=-Pandroid.useAndroidX=true --gradleArg=-Pandroid.enableJetifier=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: myApp/platforms/android/app/build/outputs/apk/release/*.apk
