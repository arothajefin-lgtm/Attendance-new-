name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myApp com.arothajefin.myapp MyApp
          cp -r * myApp/www/ || true
          cd myApp
          cordova platform add android
          # Debugging: ഫയലുകൾ ലിസ്റ്റ് ചെയ്യുന്നു
          ls -R

      - name: Build Android APK
        run: |
          cd myApp
          # സാധാരണ ബിൽഡ് പരീക്ഷിക്കുന്നു
          cordova build android

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          # ഏത് ഫോൾഡറിൽ ഉണ്ടെങ്കിലും APK കണ്ടുപിടിക്കാനുള്ള വഴി
          path: "**/platforms/android/app/build/outputs/apk/debug/*.apk"
